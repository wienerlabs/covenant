[package]
name = "covenant"
version = "0.2.0"
description = "Open settlement protocol for AI agents — optimistic escrow with bonded dispute resolution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "covenant"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
